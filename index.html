<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Peça Certa Mobile</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 16px 15px;position:sticky;top:0;z-index:3;box-shadow:0 2px 8px #0003}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:12px;color:#cbd5e1}
.search{display:flex;gap:8px;margin-top:13px}
input{width:100%;font-size:18px;padding:13px 14px;border:0;border-radius:10px;outline:none}
button{border:0;border-radius:10px;padding:0 14px;font-size:15px;font-weight:700}
#clear{background:#e5e7eb;color:#111827}
main{max-width:850px;margin:auto;padding:12px}
.info{font-size:13px;color:#4b5563;margin:2px 2px 10px}
.card{background:white;border-radius:12px;padding:13px 14px;margin:9px 0;box-shadow:0 1px 4px #0002;border:1px solid #e5e7eb}
.desc{font-size:16px;font-weight:750;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.label{font-size:11px;text-transform:uppercase;color:#6b7280;display:block}
.loc{font-weight:800}.price{font-weight:800}
.empty{text-align:center;color:#6b7280;padding:40px 12px}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.desc{font-size:15px}}
</style>
</head>
<body>
<header>
<h1>Peça Certa Mobile</h1>
<div class="sub">Consulta rápida • Código • Descrição • Locação • Preço</div>
<div class="search">
<input id="q" type="search" autocomplete="off" placeholder="Digite código ou produto…" autofocus>
<button id="clear">Limpar</button>
</div>
</header>
<main>
<div id="info" class="info"></div>
<div id="results"></div>
</main>
<script>
</script>
<script src="produtos.js"></script>
<script>
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const S=P.map((p,i)=>[norm(p[0]+" "+p[1]+" "+p[2]),i]);
let q=document.getElementById("q"), out=document.getElementById("results"), info=document.getElementById("info");
function esc(s){return (s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const term=norm(q.value.trim());
 if(!term){info.textContent=P.length.toLocaleString("pt-BR")+" produtos disponíveis";out.innerHTML='<div class="empty">Digite acima para localizar um produto.</div>';return}
 const words=term.split(/\s+/).filter(Boolean);let hits=[];
 for(const [txt,i] of S){if(words.every(w=>txt.includes(w))){hits.push(i);if(hits.length>=100)break}}
 info.textContent=hits.length+(hits.length===100?" primeiros":"")+" resultado(s)";
 if(!hits.length){out.innerHTML='<div class="empty">Nenhum produto encontrado.</div>';return}
 out.innerHTML=hits.map(i=>{const p=P[i];return `<div class="card"><div class="desc">${esc(p[1])}</div><div class="grid"><div><span class="label">Código Lobinho</span>${esc(p[0])||"—"}</div><div><span class="label">Locação</span><span class="loc">${esc(p[2])||"—"}</span></div><div><span class="label">Preço</span><span class="price">${p[3]?"R$ "+esc(p[3]):"—"}</span></div></div></div>`}).join("")
}
let timer;q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(render,80)});
document.getElementById("clear").onclick=()=>{q.value="";q.focus();render()};render();
</script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fezeqaqrqosefjklkpdg.supabase.co";
const SUPABASE_KEY = "sb_publishable_JeOZhduQY2zIhdP0Eaw4bA_9BHbA3w8";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function getDeviceId() {
  let id = localStorage.getItem("pecacerta_device_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("pecacerta_device_id", id);
  }

  return id;
}

const appOriginal = document.body.innerHTML;

function mostrarLogin(mensagem = "") {
  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f3f4f6;
      padding:20px;
      font-family:Arial,sans-serif;
    ">
      <div style="
        background:white;
        width:100%;
        max-width:380px;
        padding:28px;
        border-radius:16px;
        box-shadow:0 4px 20px #0002;
      ">

        <h1 style="
          margin:0 0 6px;
          text-align:center;
          color:#111827;
        ">
          Peça Certa Mobile
        </h1>

        <div style="
          text-align:center;
          margin-bottom:25px;
          color:#6b7280;
        ">
          Acesso autorizado
        </div>

        <input
          id="loginUsuario"
          placeholder="Usuário"
          autocomplete="username"
          style="
            width:100%;
            box-sizing:border-box;
            padding:14px;
            margin-bottom:12px;
            font-size:17px;
            border:1px solid #d1d5db;
            border-radius:10px;
          "
        >

        <input
          id="loginSenha"
          type="password"
          placeholder="Senha"
          autocomplete="current-password"
          style="
            width:100%;
            box-sizing:border-box;
            padding:14px;
            margin-bottom:14px;
            font-size:17px;
            border:1px solid #d1d5db;
            border-radius:10px;
          "
        >

        <button
          id="btnEntrar"
          style="
            width:100%;
            padding:14px;
            border:0;
            border-radius:10px;
            background:#111827;
            color:white;
            font-size:17px;
            font-weight:bold;
          "
        >
          ENTRAR
        </button>

        <div id="loginMsg" style="
          margin-top:15px;
          text-align:center;
          color:#b91c1c;
          font-size:14px;
        ">${mensagem}</div>

      </div>
    </div>
  `;

  document.getElementById("btnEntrar").onclick = entrar;

  document.getElementById("loginSenha")
    .addEventListener("keydown", e => {
      if (e.key === "Enter") entrar();
    });
}

async function entrar() {

  const usuario =
    document.getElementById("loginUsuario").value.trim().toLowerCase();

  const senha =
    document.getElementById("loginSenha").value;

  const msg =
    document.getElementById("loginMsg");

  if (!usuario || !senha) {
    msg.textContent = "Digite usuário e senha.";
    return;
  }

  msg.textContent = "Verificando...";

  const email = usuario.includes("@")
    ? usuario
    : usuario + "@pecacerta.local";

  const { data, error } =
    await sb.auth.signInWithPassword({
      email: email,
      password: senha
    });

  if (error || !data.user) {
    msg.textContent = "Usuário ou senha incorretos.";
    return;
  }

  await verificarAparelho(data.user);
}

async function verificarAparelho(user) {

  const deviceId = getDeviceId();

  const { data: cadastro, error } =
    await sb
      .from("usuarios_mobile")
      .select("id,nome,ativo,device_id")
      .eq("id", user.id)
      .single();

  if (error || !cadastro) {
    await sb.auth.signOut();
    mostrarLogin("Usuário sem autorização.");
    return;
  }

  if (!cadastro.ativo) {
    await sb.auth.signOut();
    mostrarLogin("Usuário bloqueado pelo administrador.");
    return;
  }

  if (!cadastro.device_id) {

    const { error: erroVinculo } =
      await sb
        .from("usuarios_mobile")
        .update({ device_id: deviceId })
        .eq("id", user.id)
        .is("device_id", null);

    if (erroVinculo) {
      await sb.auth.signOut();
      mostrarLogin("Não foi possível autorizar este aparelho.");
      return;
    }

    liberarApp();
    return;
  }

  if (cadastro.device_id !== deviceId) {
    await sb.auth.signOut();
    mostrarLogin("Este usuário já está vinculado a outro celular.");
    return;
  }

  liberarApp();
}

function liberarApp() {
    document.body.innerHTML = appOriginal;

    q = document.getElementById("q");
    out = document.getElementById("results");
    info = document.getElementById("info");
    const clear = document.getElementById("clear");

    if (q) {
        let timer;
        q.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(render, 80);
        });
    }

    if (clear) {
        clear.onclick = () => {
            q.value = "";
            q.focus();
            render();
        };
    }

    render();
}

async function iniciarControle() {

  const {
    data: { session }
  } = await sb.auth.getSession();

  if (!session) {
    mostrarLogin();
    return;
  }

  await verificarAparelho(session.user);
}

iniciarControle();
</script>
